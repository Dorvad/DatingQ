<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>בכנות · משחק קלפים לדייט</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* ── CSS Variables ── */
:root {
  --red: #C0202E;
  --red-dark: #9a1a24;
  --red-light: #d42a38;
  --white: #FFFFFF;
  --bg: #111111;
  --card-w: min(84vw, 340px);
  --card-h: calc(var(--card-w) * 1.54);
  --radius: 18px;
  --shadow: 0 8px 40px rgba(0,0,0,0.55);
  --font: 'Heebo', sans-serif;
  --anim: 0.3s;
}

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  font-family: var(--font);
  background: var(--bg);
  color: var(--white);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
button { font-family: var(--font); cursor: pointer; border: none; background: none; }
button:focus-visible, [tabindex]:focus-visible {
  outline: 3px solid var(--white);
  outline-offset: 3px;
}

/* ── INTRO SCREEN ── */
#intro-screen {
  position: fixed; inset: 0;
  background: var(--red);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  padding: 2rem;
  z-index: 100;
  transition: opacity 0.5s, visibility 0.5s;
}
#intro-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

.intro-logo {
  font-size: clamp(4rem, 18vw, 7rem);
  font-weight: 900;
  color: var(--white);
  letter-spacing: -2px;
  line-height: 1;
  margin-bottom: 0.5rem;
}
.intro-tagline {
  font-size: clamp(0.85rem, 3.5vw, 1.1rem);
  font-weight: 400;
  color: rgba(255,255,255,0.82);
  max-width: 280px;
  line-height: 1.55;
  margin-bottom: 2.5rem;
}
.btn-start {
  background: var(--white);
  color: var(--red);
  font-size: 1.15rem;
  font-weight: 700;
  padding: 0.9rem 2.8rem;
  border-radius: 50px;
  transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 4px 20px rgba(0,0,0,0.25);
  margin-bottom: 2rem;
}
.btn-start:active { transform: scale(0.95); }
.btn-start:hover { transform: scale(1.03); box-shadow: 0 6px 28px rgba(0,0,0,0.35); }

.intro-levels {
  display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
}
.intro-levels-label {
  font-size: 0.75rem;
  font-weight: 400;
  color: rgba(255,255,255,0.65);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 0.25rem;
}
.intro-level-btns { display: flex; gap: 0.6rem; }
.btn-level-jump {
  background: rgba(255,255,255,0.15);
  color: var(--white);
  font-size: 0.88rem;
  font-weight: 700;
  padding: 0.45rem 1.1rem;
  border-radius: 50px;
  border: 1px solid rgba(255,255,255,0.35);
  transition: background 0.15s, transform 0.15s;
}
.btn-level-jump:hover { background: rgba(255,255,255,0.28); }
.btn-level-jump:active { transform: scale(0.93); }

/* ── GAME SCREEN ── */
#game-screen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center;
  background: var(--bg);
  opacity: 0; visibility: hidden;
  transition: opacity 0.4s, visibility 0.4s;
}
#game-screen.visible { opacity: 1; visibility: visible; }

/* Header */
.game-header {
  width: 100%;
  max-width: 500px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1rem 1.25rem 0.5rem;
  flex-shrink: 0;
}
.header-title {
  font-size: 1.1rem;
  font-weight: 900;
  color: rgba(255,255,255,0.55);
  letter-spacing: -0.5px;
}
.header-btn {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.75);
  font-size: 1.1rem;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, transform 0.15s;
}
.header-btn:hover { background: rgba(255,255,255,0.16); }
.header-btn:active { transform: scale(0.88); }
.header-btn:disabled { opacity: 0.3; pointer-events: none; }

/* Card Stage */
.card-stage {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  width: 100%;
  perspective: 1200px;
}

/* Stack shadows behind main card */
.card-stack {
  position: relative;
  width: var(--card-w);
  height: var(--card-h);
}
.stack-ghost {
  position: absolute;
  inset: 0;
  border-radius: var(--radius);
  background: var(--red);
  opacity: 0.35;
  will-change: transform;
}
.stack-ghost.s2 { transform: translateY(-14px) scale(0.94); opacity: 0.22; }
.stack-ghost.s1 { transform: translateY(-7px) scale(0.97); opacity: 0.32; }

/* Main Card */
.card {
  position: absolute;
  inset: 0;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 2rem 1.6rem 1.4rem;
  cursor: pointer;
  user-select: none;
  will-change: transform;
  transition: transform 0.12s ease, box-shadow 0.12s ease;
  overflow: hidden;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
}
.card:active { transform: scale(0.975); box-shadow: 0 4px 20px rgba(0,0,0,0.6); }

/* Flip animation classes */
.card.flip-out-fwd {
  animation: flipOutFwd var(--anim) ease-in forwards;
}
.card.flip-out-rev {
  animation: flipOutRev var(--anim) ease-in forwards;
}
.card.flip-in-fwd {
  animation: flipInFwd var(--anim) ease-out forwards;
}
.card.flip-in-rev {
  animation: flipInRev var(--anim) ease-out forwards;
}

@keyframes flipOutFwd {
  from { transform: rotateY(0deg); }
  to   { transform: rotateY(-90deg); }
}
@keyframes flipInFwd {
  from { transform: rotateY(90deg); }
  to   { transform: rotateY(0deg); }
}
@keyframes flipOutRev {
  from { transform: rotateY(0deg); }
  to   { transform: rotateY(90deg); }
}
@keyframes flipInRev {
  from { transform: rotateY(-90deg); }
  to   { transform: rotateY(0deg); }
}

/* Card themes */
.card.theme-white {
  background: var(--white);
  color: var(--red);
}
.card.theme-red {
  background: var(--red);
  color: var(--white);
}

/* Card inner layout */
.card-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  gap: 0.75rem;
}
.card-badge {
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 0.28rem 0.75rem;
  border-radius: 50px;
  border: 1.5px solid currentColor;
  opacity: 0.85;
  margin-bottom: 0.25rem;
}
.card-level-label {
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  opacity: 0.6;
}
.card-title {
  font-size: clamp(2.4rem, 11vw, 4.5rem);
  font-weight: 900;
  line-height: 1;
  text-align: center;
  letter-spacing: -1.5px;
}
.card-subtitle {
  font-size: clamp(0.85rem, 3.5vw, 1.1rem);
  font-weight: 700;
  opacity: 0.75;
  text-align: center;
  letter-spacing: 0.5px;
}
.card-text {
  font-size: clamp(1.05rem, 4.5vw, 1.35rem);
  font-weight: 700;
  line-height: 1.5;
  text-align: center;
}
.card-intro-text {
  font-size: clamp(0.85rem, 3.5vw, 1rem);
  font-weight: 400;
  line-height: 1.65;
  text-align: center;
  opacity: 0.88;
  margin-top: 0.5rem;
}
.card-footer {
  width: 100%;
  text-align: center;
  font-size: 0.58rem;
  font-weight: 400;
  letter-spacing: 0.5px;
  opacity: 0.45;
  padding-top: 0.5rem;
  border-top: 1px solid currentColor;
  margin-top: 0.5rem;
}
.card.theme-white .card-footer { border-top-color: rgba(192,32,46,0.2); }
.card.theme-red .card-footer   { border-top-color: rgba(255,255,255,0.2); }

/* Wildcard badge top-left (RTL: top-right visually) */
.wildcard-tag {
  position: absolute;
  top: 1rem;
  left: 1rem;
  font-size: 0.6rem;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 0.22rem 0.65rem;
  border-radius: 50px;
  border: 1.5px solid rgba(255,255,255,0.7);
  color: rgba(255,255,255,0.9);
  background: rgba(255,255,255,0.1);
}

/* ── Direction Tags ── */
.dir-tag {
  font-size: 0.68rem;
  font-weight: 900;
  letter-spacing: 1px;
  padding: 0.3rem 0.95rem;
  border-radius: 50px;
  margin-bottom: 0.35rem;
  align-self: center;
}
.theme-white .dir-f { background: var(--red); color: #fff; }
.theme-white .dir-m { background: #111; color: #fff; }
.theme-red .dir-tag {
  background: rgba(255,255,255,0.18);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.38);
}

/* ── Progress ── */
.progress-area {
  width: 100%;
  max-width: 500px;
  padding: 0.5rem 1.5rem 0.4rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.4rem;
  flex-shrink: 0;
}
.progress-dots {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  justify-content: center;
  max-width: 260px;
}
.dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: rgba(255,255,255,0.18);
  transition: background 0.25s, transform 0.25s;
  flex-shrink: 0;
}
.dot.done  { background: rgba(255,255,255,0.55); }
.dot.active { background: var(--red); transform: scale(1.25); }

.progress-label {
  font-size: 0.7rem;
  font-weight: 700;
  color: rgba(255,255,255,0.4);
  letter-spacing: 0.5px;
}

/* ── Nav Buttons ── */
.nav-row {
  width: 100%;
  max-width: 500px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.4rem 1.25rem 1.2rem;
  flex-shrink: 0;
}
.btn-nav {
  background: rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.8);
  font-size: 0.88rem;
  font-weight: 700;
  padding: 0.6rem 1.3rem;
  border-radius: 50px;
  border: 1px solid rgba(255,255,255,0.14);
  display: flex; align-items: center; gap: 0.4rem;
  transition: background 0.15s, transform 0.12s, opacity 0.2s;
}
.btn-nav:hover { background: rgba(255,255,255,0.14); }
.btn-nav:active { transform: scale(0.93); }
.btn-nav:disabled { opacity: 0.25; pointer-events: none; }
.btn-nav-next {
  background: var(--red);
  color: var(--white);
  border-color: transparent;
  box-shadow: 0 3px 14px rgba(192,32,46,0.45);
}
.btn-nav-next:hover { background: var(--red-light); }

/* ── Responsive ── */
@media (min-width: 600px) {
  :root {
    --card-w: 340px;
  }
  .game-header { padding: 1.25rem 1.5rem 0.5rem; }
  .card-text { font-size: 1.3rem; }
}
@media (min-height: 800px) {
  .progress-area { padding: 0.75rem 1.5rem 0.5rem; }
  .nav-row { padding-bottom: 1.8rem; }
}
</style>
</head>
<body>

<!-- INTRO SCREEN -->
<div id="intro-screen" role="main">
  <div class="intro-logo" aria-label="בכנות">בכנות</div>
  <p class="intro-tagline">עד כמה הדייטינג שלך באמת כנה?<br>הגיע הזמן לגלות.</p>
  <button class="btn-start" id="btn-start" aria-label="התחל משחק">מתחילים</button>
  <div class="intro-levels">
    <div class="intro-levels-label">קפצו לרמה</div>
    <div class="intro-level-btns">
      <button class="btn-level-jump" data-level="1" aria-label="קפוץ לרמה 1">רמה 1</button>
      <button class="btn-level-jump" data-level="2" aria-label="קפוץ לרמה 2">רמה 2</button>
      <button class="btn-level-jump" data-level="3" aria-label="קפוץ לרמה 3">רמה 3</button>
    </div>
  </div>
</div>

<!-- GAME SCREEN -->
<div id="game-screen" aria-live="polite">
  <header class="game-header">
    <button class="header-btn" id="btn-back-header" aria-label="חזור לקלף הקודם">&#8594;</button>
    <span class="header-title">בכנות</span>
    <button class="header-btn" id="btn-shuffle" aria-label="ערבב קלפים">&#8645;</button>
  </header>

  <div class="card-stage" id="card-stage">
    <div class="card-stack" id="card-stack">
      <div class="stack-ghost s2" id="ghost2"></div>
      <div class="stack-ghost s1" id="ghost1"></div>
      <div class="card" id="main-card" role="button" tabindex="0" aria-label="לחץ לקלף הבא"></div>
    </div>
  </div>

  <div class="progress-area" id="progress-area">
    <div class="progress-dots" id="progress-dots"></div>
    <div class="progress-label" id="progress-label"></div>
  </div>

  <div class="nav-row">
    <button class="btn-nav" id="btn-prev" aria-label="קלף קודם">&#8594; קודם</button>
    <button class="btn-nav btn-nav-next" id="btn-next" aria-label="קלף הבא">הבא &#8592;</button>
  </div>
</div>

<script>
/* ── DECK DATA ── */
const BASE_DECK = [
  { type:'intro', title:'בכנות', text:'דייטינג לא חייב להיות ביצועים. הוא יכול להיות פשוט להכיר מישהו. כל אחד שואל, כל אחד עונה. אין ניצחון — רק כנות. מוכנים?' },

  { type:'level', level:1, title:'רמה 1', subtitle:'תפיסה' },
  { type:'q', level:1, target:'f', text:'כמה מערכות יחסים היו לי לדעתך? כמה פעמים לדעתך התאהבתי? ספרי לי מה את חושבת.' },
  { type:'q', level:1, target:'m', text:'רק מהמראה שלי — מה אתה מנחש שאני עושה בחיים?' },
  { type:'q', level:1, target:'f', text:'מה הדבר הראשון שנפל לך עליי כשנפגשנו?' },
  { type:'w', level:1, target:'both', text:'כל אחד כותב שלוש תכונות פיזיות שמושכות אותו בשני — ואז מקריא בקול.' },
  { type:'q', level:1, target:'m', text:'מה הטיפוס שלי לדעתך? תאר בפירוט.' },
  { type:'q', level:1, target:'f', text:'איך לדעתך הייתי בתיכון? נחשי.' },
  { type:'q', level:1, target:'m', text:'מה לדעתך המשקה שאני הכי אוהבת?' },
  { type:'q', level:1, target:'f', text:'לדעתך אני עדיין בקשר טוב עם האקסים שלי? למה כן או לא?' },
  { type:'w', level:1, target:'both', text:'כל אחד כותב שני "דיל ברייקרז" — הדברים שקשה לו לסבול במערכת יחסים. משווים.' },

  { type:'level', level:2, title:'רמה 2', subtitle:'חיבור' },
  { type:'q', level:2, target:'m', text:'מתי בפעם האחרונה עשית גוסטינג למישהי, ולמה?' },
  { type:'q', level:2, target:'f', text:'מה בי סיקרן אותך, מעבר למה שרואים?' },
  { type:'q', level:2, target:'m', text:'מה החברים שלך כבר יודעים עליי, אם בכלל?' },
  { type:'q', level:2, target:'f', text:'מה בעבודה שלך הכי ממלא אותך? ומה הכי מרוקן?' },
  { type:'q', level:2, target:'m', text:'מה אתה מרגיש הרבה לאחרונה?' },
  { type:'q', level:2, target:'f', text:'יש לך דעות לא שגרתיות על מערכות יחסים? ספרי.' },
  { type:'q', level:2, target:'m', text:'אתה יודע שאתה באמת מחבב מישהי כש...' },
  { type:'q', level:2, target:'f', text:'סקס היה אצלך אי פעם סיבה לפרידה? ספרי.' },
  { type:'q', level:2, target:'m', text:'איך הדעות שלך על אהבה השתנו מאז שהיית צעיר יותר?' },
  { type:'q', level:2, target:'f', text:'תארי את שבירת הלב הכי קשה שלך. מה היא לימדה אותך?' },
  { type:'w', level:2, target:'both', text:'כל אחד כותב שורה מאיזה שיר שעולה לו עכשיו לראש. משווים ומסבירים.' },
  { type:'q', level:2, target:'m', text:'ליד מי בחיים שלך אתה הכי עצמך? למה?' },
  { type:'q', level:2, target:'f', text:'מה משהו חדש שגילית על עצמך לאחרונה?' },
  { type:'q', level:2, target:'m', text:'איך אתה מגדיר דייטינג?' },
  { type:'q', level:2, target:'f', text:'שקלת אי פעם מערכת יחסים פתוחה? למה כן או לא?' },
  { type:'w', level:2, target:'both', text:'שתפו משהו שבדרך כלל לא הייתם מגלים בדייט ראשון. שניהם.' },
  { type:'q', level:2, target:'m', text:'איזו תכונה של ההורים שלך היית רוצה לשמר בעצמך? ואיזו לשחרר?' },
  { type:'q', level:2, target:'f', text:'מה הכי קשה לך בלהיות ביחסים?' },
  { type:'w', level:2, target:'both', text:'עשו אחד לשני "קעקוע" עם הכי קרוב לעט שיש — 30 שניות לכל אחד.' },
  { type:'w', level:2, target:'both', text:'כל אחד כותב שלוש תכונות שהכי חשובות לו בבן/בת זוג. משווים.' },
  { type:'q', level:2, target:'m', text:'איזו עצה על דייטינג היית נותן לעצמך בגיל 20?' },
  { type:'w', level:2, target:'both', text:'חשבו כל אחד על הסדרה הכי מוערכת בחסר שרצה עכשיו. בספירה עד שלוש — אומרים ביחד.' },
  { type:'q', level:2, target:'f', text:'מה הדייט הכי גרוע שהיית בו? ולמה?' },
  { type:'q', level:2, target:'m', text:'על מה אתה חושב יותר מדי כרגע?' },
  { type:'q', level:2, target:'f', text:'מה סבלת מאנשים בעבר שכבר אין לך סבלנות אליו היום?' },
  { type:'q', level:2, target:'m', text:'כמה אתה זמין רגשית עכשיו, בכנות? תסביר.' },
  { type:'q', level:2, target:'f', text:'מה הרווקות לימדה אותך על עצמך?' },
  { type:'q', level:2, target:'m', text:'מה בך נראה לך שנשאר לא מובן לאנשים, שוב ושוב?' },
  { type:'q', level:2, target:'f', text:'מה דבר אחד שאין לך פשרות עליו בחיים?' },
  { type:'q', level:2, target:'m', text:'מה ההורים שלך לימדו אותך על אהבה? ואיך זה משפיע עליך היום?' },

  { type:'level', level:3, title:'רמה 3', subtitle:'רפלקציה' },
  { type:'q', level:3, target:'f', text:'איזה שיר כדאי לי לשמוע בדרך הביתה, לדעתך?' },
  { type:'q', level:3, target:'m', text:'לפי מה שלמדת עליי הערב — מה לדעתך אני מחפשת?' },
  { type:'q', level:3, target:'f', text:'אילו הרגלים שלי בלטו לך הערב, אם בכלל?' },
  { type:'w', level:3, target:'both', text:'כתבו לשני הודעה שיוצאת לכם קצת מאזור הנוחות — על מה שחוויתם הערב. שניהם.' },
  { type:'q', level:3, target:'m', text:'אם היית כותב לי ביו לאפליקציה, מה היה כתוב שם?' },
  { type:'q', level:3, target:'f', text:'בסולם 1 עד 10 — כמה אני נראה לך זמין רגשית? תסבירי.' },
  { type:'w', level:3, target:'both', text:'עברו על הרשתות החברתיות של השני — בחרו תמונה אחת אהובה. משווים ומסבירים.' },
  { type:'q', level:3, target:'m', text:'במילה אחת — איך אתה מתאר את הדייט הזה?' },
  { type:'q', level:3, target:'f', text:'מה בי לא בא לידי ביטוי ברשת, לדעתך?' },
  { type:'q', level:3, target:'m', text:'מה הכי מושך אותך בי, מעבר למראה?' },
  { type:'w', level:3, target:'both', text:'שאל/שאלי אותי בדיוק מה שאתם רוצים לדעת. יש לכם אישור ללכת לשם.' },

  { type:'end', title:'זהו לבינתיים', text:'אם הגעתם עד לכאן, כנראה כבר לא באמת זרים. אפשר לערבב ולהתחיל מחדש.' },
];

/* ── State ── */
const STORAGE_KEY = 'bkneshet_v1';

let state = {
  deck: [],       // ordered array of BASE_DECK indices
  current: 0,     // index into state.deck
};

/* ── Fisher-Yates ── */
function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* ── Build deck: preserve structure, shuffle q/w within each level ── */
function buildDeck() {
  const groups = { 0: [], 1: [], 2: [], 3: [], end: [] };
  BASE_DECK.forEach((card, i) => {
    if (card.type === 'intro') groups[0].push(i);
    else if (card.type === 'end') groups.end.push(i);
    else if (card.type === 'level') {
      // level separators stay at front of their group as sentinel; store separately
    } else {
      groups[card.level].push(i);
    }
  });

  // Find level separator indices
  const levelSeps = {};
  BASE_DECK.forEach((card, i) => {
    if (card.type === 'level') levelSeps[card.level] = i;
  });

  // Shuffle q/w within each level
  [1, 2, 3].forEach(l => shuffleArray(groups[l]));

  // Assemble
  return [
    ...groups[0],
    levelSeps[1], ...groups[1],
    levelSeps[2], ...groups[2],
    levelSeps[3], ...groups[3],
    ...groups.end,
  ];
}

/* ── localStorage ── */
function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ deck: state.deck, current: state.current }));
  } catch(e) {}
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const saved = JSON.parse(raw);
    if (
      Array.isArray(saved.deck) &&
      saved.deck.length === BASE_DECK.length &&
      typeof saved.current === 'number' &&
      saved.current >= 0 && saved.current < saved.deck.length
    ) {
      state.deck = saved.deck;
      state.current = saved.current;
      return true;
    }
  } catch(e) {}
  return false;
}

/* ── Get current card data ── */
function currentCard() {
  return BASE_DECK[state.deck[state.current]];
}

/* ── Build direction tag HTML ── */
function dirTag(card) {
  if (!card.target || card.target === 'both') return '';
  if (card.target === 'f') return `<div class="dir-tag dir-f">גבר, שאל אותה:</div>`;
  if (card.target === 'm') return `<div class="dir-tag dir-m">בחורה, שאלי אותו:</div>`;
  return '';
}

/* ── Render card content into DOM element ── */
function renderCardContent(el, card) {
  el.innerHTML = '';
  el.className = 'card';

  if (card.type === 'q') {
    el.classList.add('theme-white');
    el.innerHTML = `
      <div class="card-body">
        ${dirTag(card)}
        <div class="card-text">${card.text}</div>
      </div>
      <div class="card-footer">לא באמת זרים · גרסת דייט כן</div>
    `;
  } else if (card.type === 'w') {
    el.classList.add('theme-red');
    el.innerHTML = `
      <div class="wildcard-tag">✦ וויילדקארד</div>
      <div class="card-body">
        ${dirTag(card)}
        <div class="card-text">${card.text}</div>
      </div>
      <div class="card-footer">לא באמת זרים · גרסת דייט כן</div>
    `;
  } else if (card.type === 'level') {
    el.classList.add('theme-red');
    el.innerHTML = `
      <div class="card-body">
        <div class="card-level-label">— — —</div>
        <div class="card-title">${card.title}</div>
        <div class="card-subtitle">${card.subtitle}</div>
      </div>
      <div class="card-footer">לא באמת זרים · גרסת דייט כן</div>
    `;
  } else if (card.type === 'intro') {
    el.classList.add('theme-red');
    el.innerHTML = `
      <div class="card-body">
        <div class="card-title" style="font-size:clamp(2.8rem,13vw,5rem)">${card.title}</div>
        <div class="card-intro-text">${card.text}</div>
      </div>
      <div class="card-footer">לא באמת זרים · גרסת דייט כן</div>
    `;
  } else if (card.type === 'end') {
    el.classList.add('theme-red');
    el.innerHTML = `
      <div class="card-body">
        <div class="card-title" style="font-size:clamp(1.6rem,8vw,2.8rem);letter-spacing:-1px">${card.title}</div>
        <div class="card-intro-text">${card.text}</div>
        <button class="btn-start" style="margin-top:1.2rem;font-size:0.95rem;padding:0.75rem 2rem" id="btn-restart" aria-label="ערבב והתחל מחדש">ערבב מחדש &#8635;</button>
      </div>
      <div class="card-footer">לא באמת זרים · גרסת דייט כן</div>
    `;
    // attach restart after render
    setTimeout(() => {
      const rb = document.getElementById('btn-restart');
      if (rb) rb.addEventListener('click', e => { e.stopPropagation(); restartGame(); });
    }, 0);
  }
}

/* ── Update progress indicator ── */
function updateProgress() {
  const card = currentCard();
  const dotsEl = document.getElementById('progress-dots');
  const labelEl = document.getElementById('progress-label');

  // Find current level
  let currentLevel = card.level || null;
  if (card.type === 'intro' || card.type === 'end') {
    dotsEl.innerHTML = '';
    labelEl.textContent = card.type === 'intro' ? 'פתיחה' : 'סיום';
    return;
  }
  if (card.type === 'level') currentLevel = card.level;

  // Collect cards for this level (q + w + level-sep)
  const levelCards = state.deck
    .map((bi, di) => ({ bi, di, card: BASE_DECK[bi] }))
    .filter(({ card: c }) => c.level === currentLevel && (c.type === 'q' || c.type === 'w' || c.type === 'level'));

  const posInLevel = levelCards.findIndex(({ di }) => di === state.current);

  dotsEl.innerHTML = levelCards.map(({ di }, i) => {
    let cls = 'dot';
    if (i < posInLevel) cls += ' done';
    if (i === posInLevel) cls += ' active';
    return `<span class="${cls}"></span>`;
  }).join('');

  // Count only q/w cards for the fraction
  const levelQW = state.deck
    .map((bi, di) => ({ bi, di, card: BASE_DECK[bi] }))
    .filter(({ card: c }) => c.level === currentLevel && (c.type === 'q' || c.type === 'w'));
  const qwPos = levelQW.filter(({ di }) => di <= state.current && (BASE_DECK[state.deck[di]] || {})).length;

  // simpler: just count q/w up to and including current
  let playedQW = 0, totalQW = 0;
  levelQW.forEach(({ di }) => {
    totalQW++;
    if (di <= state.current) playedQW++;
  });

  labelEl.textContent = `רמה ${currentLevel} · ${playedQW} / ${totalQW}`;

  // Update nav button states
  document.getElementById('btn-prev').disabled = state.current === 0;
  document.getElementById('btn-back-header').disabled = state.current === 0;
  document.getElementById('btn-next').disabled = state.current >= state.deck.length - 1;
}

/* ── Animation engine ── */
let animating = false;

function flip(direction, callback) {
  if (animating) return;
  animating = true;

  const el = document.getElementById('main-card');
  const outClass = direction === 'fwd' ? 'flip-out-fwd' : 'flip-out-rev';
  const inClass  = direction === 'fwd' ? 'flip-in-fwd'  : 'flip-in-rev';

  el.classList.add(outClass);

  el.addEventListener('animationend', function onOut() {
    el.removeEventListener('animationend', onOut);
    el.classList.remove(outClass);
    callback(); // swap content
    el.classList.add(inClass);

    el.addEventListener('animationend', function onIn() {
      el.removeEventListener('animationend', onIn);
      el.classList.remove(inClass);
      animating = false;
    });
  });
}

/* ── Advance / retreat ── */
function advanceCard() {
  if (animating || state.current >= state.deck.length - 1) return;
  flip('fwd', () => {
    state.current++;
    saveState();
    renderCardContent(document.getElementById('main-card'), currentCard());
    updateProgress();
  });
}

function retreatCard() {
  if (animating || state.current <= 0) return;
  flip('rev', () => {
    state.current--;
    saveState();
    renderCardContent(document.getElementById('main-card'), currentCard());
    updateProgress();
  });
}

/* ── Jump to level ── */
function jumpToLevel(level) {
  // Find the level separator index in deck
  const idx = state.deck.findIndex(bi => {
    const c = BASE_DECK[bi];
    return c.type === 'level' && c.level === level;
  });
  if (idx < 0) return;
  state.current = idx;
  saveState();
  renderCardContent(document.getElementById('main-card'), currentCard());
  updateProgress();
}

/* ── Shuffle current level ── */
function shuffleCurrentLevel() {
  const card = currentCard();
  let level = card.level || null;
  if (!level) return;

  // Find the bounds of this level in state.deck
  const levelSepIdx = state.deck.findIndex(bi => {
    const c = BASE_DECK[bi];
    return c.type === 'level' && c.level === level;
  });
  // End is next level separator or end card
  let endIdx = state.deck.length;
  for (let i = levelSepIdx + 1; i < state.deck.length; i++) {
    const c = BASE_DECK[state.deck[i]];
    if (c.type === 'level' || c.type === 'end') { endIdx = i; break; }
  }

  // Extract q/w indices for this level and shuffle
  const segment = state.deck.slice(levelSepIdx + 1, endIdx);
  shuffleArray(segment);
  state.deck.splice(levelSepIdx + 1, segment.length, ...segment);

  // Jump to level start
  state.current = levelSepIdx;
  saveState();
  renderCardContent(document.getElementById('main-card'), currentCard());
  updateProgress();
}

/* ── Restart ── */
function restartGame() {
  state.deck = buildDeck();
  state.current = 0;
  saveState();
  renderCardContent(document.getElementById('main-card'), currentCard());
  updateProgress();
}

/* ── Show game screen ── */
function showGame(startLevel) {
  document.getElementById('intro-screen').classList.add('hidden');
  const gs = document.getElementById('game-screen');
  gs.classList.add('visible');

  if (startLevel) {
    jumpToLevel(startLevel);
  } else {
    renderCardContent(document.getElementById('main-card'), currentCard());
    updateProgress();
  }
}

/* ── Touch / swipe ── */
let touchStartX = 0, touchStartY = 0;
document.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });
document.addEventListener('touchend', e => {
  const dx = touchStartX - e.changedTouches[0].clientX;
  const dy = Math.abs(touchStartY - e.changedTouches[0].clientY);
  if (Math.abs(dx) > 40 && Math.abs(dx) > dy) {
    if (dx > 0) advanceCard();
    else retreatCard();
  }
}, { passive: true });

/* ── Keyboard ── */
document.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'ArrowRight') { e.preventDefault(); advanceCard(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); retreatCard(); }
});

/* ── Button wiring ── */
document.getElementById('main-card').addEventListener('click', () => advanceCard());
document.getElementById('main-card').addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); advanceCard(); }
});
document.getElementById('btn-next').addEventListener('click', advanceCard);
document.getElementById('btn-prev').addEventListener('click', retreatCard);
document.getElementById('btn-back-header').addEventListener('click', retreatCard);
document.getElementById('btn-shuffle').addEventListener('click', shuffleCurrentLevel);

document.getElementById('btn-start').addEventListener('click', () => showGame(null));
document.querySelectorAll('.btn-level-jump').forEach(btn => {
  btn.addEventListener('click', () => {
    const lvl = parseInt(btn.dataset.level);
    showGame(lvl);
  });
});

/* ── Init ── */
function init() {
  if (!loadState()) {
    state.deck = buildDeck();
    state.current = 0;
  }
  // Pre-render card (hidden behind intro)
  renderCardContent(document.getElementById('main-card'), currentCard());
  updateProgress();
}

init();
</script>
